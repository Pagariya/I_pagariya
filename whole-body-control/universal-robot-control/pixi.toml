[project]
name = "universal-robot-control"
version = "0.1.0"
description = "Robot-agnostic dynamics and controls foundation"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
cmake = ">=3.25"
ninja = "*"
compilers = "*"
pkg-config = "*"
eigen = "*"
pinocchio = ">=3.0"
gtest = "*"
idyntree = ">=15.1.0,<16"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
demo = { cmd = "./build/urc_demo models/arm6/arm6.urdf", depends-on = ["build"] }
