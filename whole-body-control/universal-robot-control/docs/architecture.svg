<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Architecture of the Universal Robot Control framework">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#475569}.heading{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1100" height="470" rx="22" fill="#f8fafc"/><text x="44" y="51" class="title">Universal Robot Control</text><text x="44" y="78" class="sub">C++20 · Eigen · Pinocchio · URDF-based model</text>
<rect x="40" y="130" width="230" height="105" rx="14" fill="#dbeafe" stroke="#93c5fd"/><text x="58" y="161" class="heading">Joint-space target</text><text x="58" y="189" class="body">q_des · v_des · a_des</text><text x="58" y="211" class="small">Computed torque input</text>
<rect x="40" y="270" width="230" height="105" rx="14" fill="#ffedd5" stroke="#fdba74"/><text x="58" y="301" class="heading">Cartesian target</text><text x="58" y="329" class="body">x_des · dx_des</text><text x="58" y="351" class="small">Impedance input</text>
<rect x="330" y="130" width="250" height="105" rx="14" fill="#bfdbfe" stroke="#60a5fa"/><text x="350" y="161" class="heading">Computed torque</text><text x="350" y="190" class="body">PD acceleration correction</text><text x="350" y="212" class="small">RNEA inverse dynamics</text>
<rect x="330" y="270" width="250" height="105" rx="14" fill="#fed7aa" stroke="#fb923c"/><text x="350" y="301" class="heading">Cartesian impedance</text><text x="350" y="330" class="body">Virtual spring + damper</text><text x="350" y="352" class="small">JvᵀF + gravity compensation</text>
<rect x="645" y="182" width="200" height="142" rx="14" fill="#dcfce7" stroke="#86efac"/><text x="666" y="215" class="heading">Joint torques τ</text><text x="666" y="243" class="body">Controller output</text><text x="666" y="267" class="small">Demo: calculate and print</text><text x="666" y="287" class="small">No motion execution yet</text>
<rect x="890" y="182" width="170" height="142" rx="14" fill="#ede9fe" stroke="#c4b5fd"/><text x="910" y="215" class="heading">RobotModel</text><text x="910" y="244" class="body">Kinematics</text><text x="910" y="266" class="body">Jacobian · inertia</text><text x="910" y="288" class="body">RNEA · ABA · CRBA</text>
<path class="line" d="M270 182H330"/><path class="line" d="M270 322H330"/><path class="line" d="M580 182H612V226H645"/><path class="line" d="M580 322H612V280H645"/><path class="line" d="M845 253H890"/>
<text x="42" y="428" class="small">Current: torque computation at a fixed state   •   Planned: closed-loop simulation, contact dynamics, 6D impedance and safety limits</text>
</svg>
